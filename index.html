        function updateEmail() {
            const idioma = document.getElementById('idioma').value;
            let empresa = document.getElementById('empresa').value.trim();
            if (!empresa) {
                empresa = "[Empresa / Responsable]";
            }

            const data = content[idioma];
            document.getElementById('asunto').value = data.subject;
            
            let finalBody = data.body.replace(/{empresa}/g, empresa);
            document.getElementById('cuerpo').value = finalBody;
        }

        function copyToClipboard() {
            const bodyText = document.getElementById('cuerpo').value;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(bodyText).then(() => showNotification());
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = bodyText;
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showNotification();
                } catch (err) {
                    console.error('Failed to copy', err);
                }
                document.body.removeChild(textArea);
            }
        }

        function showNotification() {
            const notif = document.getElementById('notification');
            notif.classList.remove('hidden');
            setTimeout(() => { 
                notif.classList.add('hidden'); 
            }, 3000);
        }

        function sendEmail() {
            const destinatario = document.getElementById('destinatario').value;
            const asunto = encodeURIComponent(document.getElementById('asunto').value);
            const cuerpo = encodeURIComponent(document.getElementById('cuerpo').value);
            
            window.location.href = `mailto:${destinatario}?subject=${asunto}&body=${cuerpo}`;
        }

        // Initialize on load
        window.onload = updateEmail;
