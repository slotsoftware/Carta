<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Correos - SlotSoftware</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2d2d2d;
            --text-color: #f0f0f0;
            --accent: #c0c0c0; /* Plata, inspirado en los raíles de las pistas */
            --accent-blue: #0078D7;
            --border: #444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }
        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 5px;
        }
        h2 {
            text-align: center;
            font-size: 14px;
            color: #aaa;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ddd;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid var(--border);
            background-color: #121212;
            color: var(--text-color);
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        textarea {
            height: 350px;
            resize: vertical;
            line-height: 1.5;
        }
        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-send {
            background-color: var(--accent-blue);
            color: white;
        }
        .btn-send:hover {
            background-color: #005a9e;
        }
        .btn-copy {
            background-color: #555;
            color: white;
        }
        .btn-copy:hover {
            background-color: #666;
        }
        #notification {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SlotSoftware</h1>
        <h2>Gestor Multilingüe de Correos Comerciales</h2>

        <div class="form-group">
            <label for="idioma">Selecciona el Idioma:</label>
            <select id="idioma" onchange="updateEmail()">

                <option value="ca">Català (Catalán)</option>
                <option value="en">English (Inglés)</option>
                <option value="fr">Français (Francés)</option>
                <option value="it">Italiano (Italiano)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="destinatario">Correo del Destinatario (Opcional):</label>
            <input type="email" id="destinatario" placeholder="ejemplo@empresa.com">
        </div>

        <div class="form-group">
            <label for="empresa">Nombre de la Empresa o Responsable:</label>
            <input type="text" id="empresa" placeholder="Empresa / Responsable" oninput="updateEmail()">
        </div>

        <div class="form-group">
            <label for="asunto">Asunto del Correo:</label>
            <input type="text" id="asunto">
        </div>

        <div class="form-group">
            <label for="cuerpo">Cuerpo del Mensaje:</label>
            <textarea id="cuerpo"></textarea>
        </div>

        <div class="buttons">
            <button class="btn-copy" onclick="copyToClipboard()">Copiar Mensaje</button>
            <button class="btn-send" onclick="sendEmail()">Abrir en Gestor de Correo</button>
        </div>
        
        <div id="notification">¡Texto copiado al portapapeles!</div>
    </div>

        function updateEmail() {
            const idioma = document.getElementById('idioma').value;
            let empresa = document.getElementById('empresa').value.trim();
            if (!empresa) {
                empresa = "[Empresa / Responsable]";
            }

            const data = content[idioma];
            
            document.getElementById('asunto').value = data.subject;
            
            let finalBody = data.body.replace(/{empresa}/g, empresa);
            document.getElementById('cuerpo').value = finalBody;
        }

        function copyToClipboard() {
            const bodyText = document.getElementById('cuerpo').value;
            // Use execCommand as a fallback for iframe environments where navigator.clipboard might be restricted
            const textArea = document.createElement("textarea");
            textArea.value = bodyText;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                const notif = document.getElementById('notification');
                notif.style.display = 'block';
                setTimeout(() => { notif.style.display = 'none'; }, 3000);
            } catch (err) {
                console.error('Failed to copy', err);
            }
            document.body.removeChild(textArea);
        }

        function sendEmail() {
            const destinatario = document.getElementById('destinatario').value;
            const asunto = encodeURIComponent(document.getElementById('asunto').value);
            const cuerpo = encodeURIComponent(document.getElementById('cuerpo').value);
            
            window.location.href = `mailto:${destinatario}?subject=${asunto}&body=${cuerpo}`;
        }

        // Initialize on load
        window.onload = updateEmail;
    </script>
</body>
</html>
