<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlotSoftware | Gestor de Campañas B2B</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cyan-neon': '#00e5ff',
                        'blue-neon': '#0066ff',
                        'dark-abyss': '#00040c',
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #000205;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
        }
        .glass-panel {
            background: rgba(0, 10, 25, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.25);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.08) inset, 0 8px 32px rgba(0, 0, 0, 0.8);
        }
        input, textarea, select {
            background: rgba(0, 229, 255, 0.03) !important;
            border: 1px solid rgba(0, 229, 255, 0.2) !important;
            color: #ffffff !important;
            font-family: 'Share Tech Mono', monospace !important;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #00e5ff !important;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.25) inset !important;
            outline: none;
        }
        select option {
            background-color: #00040c;
            color: #00e5ff;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.4); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 229, 255, 0.6); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="border-b border-cyan-neon/20 bg-dark-abyss/90 sticky top-0 z-50 px-6 py-4 flex justify-between items-center backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-cyan-neon rounded-full animate-ping"></div>
            <h1 class="text-lg font-bold font-sans tracking-widest text-cyan-neon">SLOTSOFTWARE // <span class="text-white text-xs font-mono">B2B MAILER</span></h1>
        </div>
        <div class="flex items-center gap-4 text-xs">
            <span class="text-cyan-neon/70 hidden sm:inline">ESTADO: <span id="sys-status" class="text-green-400">LISTO PARA ENVÍO</span></span>
        </div>
    </header>

    <main class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <div class="glass-panel p-6 rounded-sm flex flex-col gap-4">
                <div class="flex justify-between items-center border-b border-cyan-neon/20 pb-3">
                    <h2 class="font-sans font-bold text-cyan-neon text-sm tracking-wider flex items-center gap-2">
                        <i data-lucide="users" class="w-4 h-4"></i> DESTINATARIOS (<span id="contador-emails">0</span>)
                    </h2>
                    <button onclick="limpiarEmails()" class="text-xs text-red-400 hover:text-red-300 transition-colors">Limpiar</button>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-xs text-cyan-neon/70">Añadir Correo Individual:</label>
                    <div class="flex gap-2">
                        <input type="email" id="input-email" placeholder="tienda@ejemplo.com" class="flex-grow p-2 text-sm rounded-sm">
                        <button onclick="agregarEmail()" class="bg-cyan-neon/10 border border-cyan-neon text-cyan-neon px-4 py-2 text-xs font-bold hover:bg-cyan-neon/20 transition-all rounded-sm">AÑADIR</button>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-xs text-cyan-neon/70">O pegar lista masiva (separados por comas o saltos de línea):</label>
                    <textarea id="textarea-masivo" rows="3" placeholder="tienda1@slot.com, tienda2@slot.com..." class="p-2 text-xs rounded-sm resize-none"></textarea>
                    <button onclick="importarListaMasiva()" class="bg-blue-neon/20 border border-blue-neon text-cyan-neon py-2 text-xs font-bold hover:bg-blue-neon/30 transition-all rounded-sm">IMPORTAR LISTA</button>
                </div>

                <div class="mt-2">
                    <div class="text-xs text-cyan-neon/60 mb-2">Cola de envío activa:</div>
                    <div id="lista-destinatarios-container" class="max-h-48 overflow-y-auto flex flex-col gap-1.5 pr-1">
                        <div class="text-xs text-gray-500 italic p-2 bg-black/40 text-center">No hay correos agregados todavía.</div>
                    </div>
                </div>
            </div>

            <!-- Panel de Configuración de Enlace Web -->
            <div class="glass-panel p-6 rounded-sm flex flex-col gap-4">
                <h3 class="font-sans font-bold text-cyan-neon text-sm tracking-wider flex items-center gap-2 border-b border-cyan-neon/20 pb-3">
                    <i data-lucide="link" class="w-4 h-4"></i> ENLACE A TU APP / WEB
                </h3>
                <div>
                    <label class="text-xs text-cyan-neon/70 mb-1 block">URL de tu web interactiva / presentación:</label>
                    <input type="text" id="input-url-web" value="https://slotsoftware.github.io/Web/" class="w-full p-2.5 text-xs rounded-sm text-cyan-neon font-bold">
                </div>
            </div>

        </div>

        <div class="lg:col-span-7 flex flex-col gap-6">
            
            <div class="glass-panel p-6 rounded-sm flex flex-col gap-5 flex-grow">
                <div class="flex justify-between items-center border-b border-cyan-neon/20 pb-3">
                    <h2 class="font-sans font-bold text-cyan-neon text-sm tracking-wider flex items-center gap-2">
                        <i data-lucide="file-text" class="w-4 h-4"></i> COMPOSICIÓN
                    </h2>
                    
                    <div class="flex items-center gap-2">
                        <label class="text-xs text-cyan-neon/60 hidden sm:block">Idioma:</label>
                        <select id="selector-idioma" onchange="cambiarIdiomaPlantilla()" class="bg-black/50 border border-cyan-neon/30 text-cyan-neon text-xs rounded-sm px-2 py-1 outline-none cursor-pointer font-sans font-bold uppercase">
                            <option value="es">🇪🇸 Español</option>
                            <option value="ca">🟨 Català</option>
                            <option value="en">🇬🇧 English</option>
                            <option value="fr">🇫🇷 Français</option>
                            <option value="it">🇮🇹 Italiano</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-xs text-cyan-neon/70">Asunto del Correo:</label>
                    <input type="text" id="input-asunto" class="w-full p-2.5 text-xs rounded-sm font-bold">
                </div>

                <div class="flex flex-col gap-2 flex-grow">
                    <div class="flex justify-between items-end">
                        <label class="text-xs text-cyan-neon/70">Cuerpo del Mensaje:</label>
                        <div class="flex gap-2">
                            <button onclick="guardarPlantilla()" class="flex items-center gap-1 bg-cyan-neon/20 border border-cyan-neon/50 text-cyan-neon px-3 py-1 text-[10px] uppercase font-bold hover:bg-cyan-neon/40 transition-all rounded-sm">
                                <i data-lucide="save" class="w-3 h-3"></i> Guardar Plantilla
                            </button>
                            <button onclick="restaurarPlantilla()" class="flex items-center gap-1 bg-red-500/20 border border-red-500/50 text-red-400 px-3 py-1 text-[10px] uppercase font-bold hover:bg-red-500/40 transition-all rounded-sm">
                                <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Restaurar Original
                            </button>
                        </div>
                    </div>
                    <textarea id="input-cuerpo" rows="20" class="w-full p-3 text-xs rounded-sm leading-relaxed resize-y font-mono"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-3 border-t border-cyan-neon/20 mt-1">
                    <button onclick="copiarCarta()" class="bg-cyan-neon/10 border border-cyan-neon text-cyan-neon py-3 text-xs font-bold hover:bg-cyan-neon/20 transition-all rounded-sm flex items-center justify-center gap-2">
                        <i data-lucide="copy" class="w-4 h-4"></i> COPIAR CARTA
                    </button>
                    <button onclick="enviarCorreoMasivoCliente()" class="bg-cyan-neon text-black py-3 text-xs font-bold hover:bg-cyan-neon/80 transition-all rounded-sm flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(0,229,255,0.4)]">
                        <i data-lucide="send" class="w-4 h-4"></i> REDACTAR / ENVIAR
                    </button>
                </div>
            </div>

        </div>

    </main>

    <div id="modal-aviso" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full p-6 rounded-sm text-center flex flex-col gap-4">
            <h3 id="modal-titulo" class="font-sans font-bold text-cyan-neon text-base">AVISO DEL SISTEMA</h3>
            <div id="modal-texto" class="text-xs text-gray-300 leading-relaxed"></div>
            <button onclick="cerrarModal()" class="border border-cyan-neon text-cyan-neon py-2 text-xs font-bold hover:bg-cyan-neon/20 transition-all rounded-sm mt-2">CERRAR</button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let listaEmails = [];

        // Diccionario de Plantillas Multilingüe
        const PLANTILLAS = {
            es: {
                asunto: "Propuesta de colaboración: Innovación tecnológica para el automodelismo de ranura (SlotSoftware)",
                cuerpo: `Estimado/a [Empresa / Responsable],

Me dirijo a usted en representación de SlotSoftware, desarrolladores de un ecosistema digital avanzado diseñado exclusivamente para modernizar y potenciar el automodelismo de ranura (Slot).

Conociendo la trayectoria de su establecimiento en el sector, nos gustaría presentarle nuestra suite de aplicaciones de cronometraje, telemetría y simulación 3D sin necesidad de costoso hardware adicional (funciona directamente mediante la cámara y el navegador).

Principales soluciones para ofrecer a sus clientes:
- Krono V.4.0 (Personal y Dual): Fotodetector profesional con IA a 30/60fps y Modo TV en Smart TV vía nube.
- Tracks Telemetry: Simulador 3D de circuitos de hasta 8 carriles con físicas reales y configuración de motores/neumáticos.
- Arquitectura Multijugador P2P en tiempo real.

Le invitamos a explorar nuestro entorno interactivo y catálogo visual en el siguiente enlace:
https://slotsoftware.github.io/Web/

Nos encantaría programar una breve reunión para mostrarle el funcionamiento en vivo. Quedo a su entera disposición.

Atentamente,
Albert Closa
SlotSoftware`
            },
            ca: {
                asunto: "Proposta de col·laboració: Innovació tecnològica per a l'automodelisme de ranura (SlotSoftware)",
                cuerpo: `Benvolgut/da [Empresa / Responsable],

Em dirigeixo a vostè en representació de SlotSoftware, desenvolupadors d'un ecosistema digital avançat dissenyat exclusivament per modernitzar i potenciar l'automodelisme de ranura (Slot).

Coneixent la trajectòria del seu establiment en el sector, ens agradaria presentar-li la nostra suite d'aplicacions de cronometratge, telemetria i simulació 3D sense necessitat de costós maquinari addicional (funciona directament mitjançant la càmera i el navegador).

Principals solucions per oferir als seus clients:
- Krono V.4.0 (Personal i Dual): Fotodetector professional amb IA a 30/60fps i Mode TV en Smart TV via núvol.
- Tracks Telemetry: Simulador 3D de circuits de fins a 8 carrils amb físiques reals i configuració de motors/pneumàtics.
- Arquitectura Multijugador P2P en temps real.

El convidem a explorar el nostre entorn interactiu i catàleg visual en el següent enllaç:
https://slotsoftware.github.io/Web/

Ens encantaria programar una breu reunió per mostrar-li el funcionament en viu. Resto a la seva sencera disposició.

Atentament,
Albert Closa
SlotSoftware`
            },
            en: {
                asunto: "Partnership Proposal: Technological Innovation for Slot Car Racing (SlotSoftware)",
                cuerpo: `Dear [Company / Manager],

I am writing to you on behalf of SlotSoftware, developers of an advanced digital ecosystem designed exclusively to modernize and enhance slot car racing.

Knowing your establishment's track record in the sector, we would like to present our suite of timing, telemetry, and 3D simulation applications that require no expensive additional hardware (works directly via camera and browser).

Main solutions to offer your customers:
- Krono V.4.0 (Personal & Dual): Professional AI photodetector at 30/60fps and TV Mode on Smart TVs via the cloud.
- Tracks Telemetry: 3D track simulator up to 8 lanes with real physics and motor/tire configuration.
- Real-time P2P Multiplayer Architecture.

We invite you to explore our interactive environment and visual catalog at the following link:
https://slotsoftware.github.io/Web/

We would love to schedule a brief meeting to show you a live demonstration. I remain at your complete disposal.

Sincerely,
Albert Closa
SlotSoftware`
            },
            fr: {
                asunto: "Proposition de partenariat : Innovation technologique pour le Slot Racing (SlotSoftware)",
                cuerpo: `Cher/Chère [Entreprise / Responsable],

Je m'adresse à vous au nom de SlotSoftware, développeurs d'un écosystème numérique avancé conçu exclusivement pour moderniser et améliorer le circuit routier électrique (Slot Racing).

Connaissant le parcours de votre établissement dans le secteur, nous souhaitons vous présenter notre suite d'applications de chronométrage, télémétrie et simulation 3D sans avoir besoin de matériel supplémentaire coûteux (fonctionne directement via la caméra et le navigateur).

Principales solutions à proposer à vos clients :
- Krono V.4.0 (Personnel et Dual) : Photodétecteur professionnel avec IA à 30/60fps et Mode TV sur Smart TV via le cloud.
- Tracks Telemetry : Simulateur 3D de circuits jusqu'à 8 voies avec physique réelle et configuration des moteurs/pneus.
- Architecture Multijoueur P2P en temps réel.

Nous vous invitons à explorer notre environnement interactif et notre catalogue visuel sur le lien suivant :
https://slotsoftware.github.io/Web/

Nous serions ravis de programmer une brève réunion pour vous montrer le fonctionnement en direct. Je reste à votre entière disposition.

Cordialement,
Albert Closa
SlotSoftware`
            },
            it: {
                asunto: "Proposta di collaborazione: Innovazione tecnologica per lo Slot Car Racing (SlotSoftware)",
                cuerpo: `Gentile [Azienda / Responsabile],

Mi rivolgo a Lei a nome di SlotSoftware, sviluppatori di un ecosistema digitale avanzato progettato esclusivamente per modernizzare e potenziare l'automodellismo a pista elettrica (Slot).

Conoscendo l'esperienza del Suo stabilimento nel settore, vorremmo presentarLe la nostra suite di applicazioni di cronometraggio, telemetria e simulazione 3D senza la necessità di costosi hardware aggiuntivi (funziona direttamente tramite fotocamera e browser).

Principali soluzioni da offrire ai Suoi clienti:
- Krono V.4.0 (Personale e Dual): Rilevatore ottico professionale con IA a 30/60fps e Modalità TV su Smart TV tramite cloud.
- Tracks Telemetry: Simulatore 3D di circuiti fino a 8 corsie con fisica reale e configurazione di motori/pneumatici.
- Architettura Multiplayer P2P in tempo reale.

La invitiamo a esplorare il nostro ambiente interattivo e il catalogo visivo al seguente link:
https://slotsoftware.github.io/Web/

Saremmo lieti di fissare un breve incontro per mostrarLe il funzionamento dal vivo. Resto a Sua completa disposizione.

Cordiali saluti,
Albert Closa
SlotSoftware`
            }
        };

        // Al cargar la página, inicializamos la plantilla
        window.onload = function() {
            cargarPlantilla();
        };

        function cambiarIdiomaPlantilla() {
            const idioma = document.getElementById('selector-idioma').value;
            document.getElementById('input-asunto').value = PLANTILLAS[idioma].asunto;
            document.getElementById('input-cuerpo').value = PLANTILLAS[idioma].cuerpo;
            
            const nombreIdioma = document.getElementById('selector-idioma').options[document.getElementById('selector-idioma').selectedIndex].text;
            mostrarModal("IDIOMA CAMBIADO", `Se ha cargado la plantilla oficial en <b>${nombreIdioma}</b>.<br><br><span class="text-yellow-400">Nota: Si tenías textos personalizados sin guardar, han sido sobrescritos por esta plantilla.</span>`);
        }

        function guardarPlantilla() {
            const asunto = document.getElementById('input-asunto').value;
            const cuerpo = document.getElementById('input-cuerpo').value;
            const idioma = document.getElementById('selector-idioma').value;
            
            localStorage.setItem('slot_asunto', asunto);
            localStorage.setItem('slot_cuerpo', cuerpo);
            localStorage.setItem('slot_idioma', idioma);
            
            mostrarModal("PLANTILLA GUARDADA", "Tu carta y asunto se han guardado en este navegador. Se cargarán automáticamente la próxima vez que abras esta herramienta.");
        }

        function cargarPlantilla() {
            const guardadoIdioma = localStorage.getItem('slot_idioma');
            const guardadoAsunto = localStorage.getItem('slot_asunto');
            const guardadoCuerpo = localStorage.getItem('slot_cuerpo');

            const idiomaFinal = guardadoIdioma ? guardadoIdioma : 'es';
            document.getElementById('selector-idioma').value = idiomaFinal;

            // Si hay algo guardado, lo cargamos. Si no, cargamos lo predeterminado del idioma seleccionado.
            document.getElementById('input-asunto').value = guardadoAsunto !== null ? guardadoAsunto : PLANTILLAS[idiomaFinal].asunto;
            document.getElementById('input-cuerpo').value = guardadoCuerpo !== null ? guardadoCuerpo : PLANTILLAS[idiomaFinal].cuerpo;
        }

        function restaurarPlantilla() {
            const idioma = document.getElementById('selector-idioma').value;
            document.getElementById('input-asunto').value = PLANTILLAS[idioma].asunto;
            document.getElementById('input-cuerpo').value = PLANTILLAS[idioma].cuerpo;
            
            // Borramos lo guardado
            localStorage.removeItem('slot_asunto');
            localStorage.removeItem('slot_cuerpo');
            localStorage.removeItem('slot_idioma');
            
            mostrarModal("PLANTILLA RESTAURADA", "Se ha vuelto a la carta original de SlotSoftware para este idioma y se han borrado los datos guardados.");
        }

        function mostrarModal(titulo, texto) {
            document.getElementById('modal-titulo').innerText = titulo;
            document.getElementById('modal-texto').innerHTML = texto;
            const modal = document.getElementById('modal-aviso');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            lucide.createIcons();
        }

        function cerrarModal() {
            const modal = document.getElementById('modal-aviso');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function agregarEmail() {
            const input = document.getElementById('input-email');
            const email = input.value.trim();
            if(!email) return;
            
            if(!email.includes('@') || !email.includes('.')) {
                mostrarModal("ERROR DE FORMATO", "El correo introducido no parece válido.");
                return;
            }

            if(listaEmails.includes(email)) {
                mostrarModal("AVISO", "Este correo ya se encuentra en la lista de envío.");
                return;
            }

            listaEmails.push(email);
            input.value = '';
            actualizarListaVisual();
        }

        function importarListaMasiva() {
            const text = document.getElementById('textarea-masivo').value.trim();
            if(!text) return;

            const tokens = text.split(/[\s,]+/);
            let anadidos = 0;

            tokens.forEach(t => {
                let cleanEmail = t.replace(/[<>"]/g, '').trim();
                if(cleanEmail.includes('@') && cleanEmail.includes('.') && !listaEmails.includes(cleanEmail)) {
                    listaEmails.push(cleanEmail);
                    anadidos++;
                }
            });

            document.getElementById('textarea-masivo').value = '';
            actualizarListaVisual();
            mostrarModal("IMPORTACIÓN EXITOSA", `Se han añadido ${anadidos} nuevos correos a la cola.`);
        }

        function eliminarEmail(index) {
            listaEmails.splice(index, 1);
            actualizarListaVisual();
        }

        function limpiarEmails() {
            listaEmails = [];
            actualizarListaVisual();
        }

        function actualizarListaVisual() {
            const container = document.getElementById('lista-destinatarios-container');
            document.getElementById('contador-emails').innerText = listaEmails.length;

            if(listaEmails.length === 0) {
                container.innerHTML = '<div class="text-xs text-gray-500 italic p-2 bg-black/40 text-center">No hay correos agregados todavía.</div>';
                return;
            }

            container.innerHTML = '';
            listaEmails.forEach((email, idx) => {
                let div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-cyan-neon/5 border border-cyan-neon/10 p-2 rounded text-xs';
                div.innerHTML = `
                    <span class="truncate pr-2 text-cyan-200">${email}</span>
                    <button onclick="eliminarEmail(${idx})" class="text-red-400 hover:text-red-300 font-bold px-1.5 py-0.5">×</button>
                `;
                container.appendChild(div);
            });
        }

        function obtenerCuerpoPersonalizado() {
            return document.getElementById('input-cuerpo').value;
        }

        function copiarCarta() {
            const asunto = document.getElementById('input-asunto').value;
            const cuerpo = obtenerCuerpoPersonalizado();
            const textoCompleto = `ASUNTO: ${asunto}\n\n${cuerpo}`;

            if(navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textoCompleto).then(() => {
                    mostrarModal("PORTAPAPELES", "La carta ha sido copiada con éxito.");
                }).catch(() => {
                    ejecutarCopiaAlternativa(textoCompleto);
                });
            } else {
                ejecutarCopiaAlternativa(textoCompleto);
            }
        }

        function ejecutarCopiaAlternativa(texto) {
            const textarea = document.createElement('textarea');
            textarea.value = texto;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                mostrarModal("PORTAPAPELES", "Carta copiada correctamente.");
            } catch (err) {
                mostrarModal("ERROR", "No se pudo copiar automáticamente.");
            }
            document.body.removeChild(textarea);
        }

        function enviarCorreoMasivoCliente() {
            const asunto = document.getElementById('input-asunto').value;
            const cuerpo = obtenerCuerpoPersonalizado();
            const destinatariosBCC = listaEmails.length > 0 ? listaEmails.join(',') : '';
            
            // Link Seguro de Gmail Web
            const baseUrl = "https://mail.google.com/mail/?view=cm&fs=1";
            const toParam = "&to=";
            const suParam = "&su=" + encodeURIComponent(asunto);
            const bodyParam = "&body=" + encodeURIComponent(cuerpo);
            const bccParam = destinatariosBCC ? "&bcc=" + encodeURIComponent(destinatariosBCC) : "";
            const gmailLink = baseUrl + toParam + suParam + bodyParam + bccParam;

            // Link Universal (Aplicación de sistema / Mailto)
            const mailtoLink = `mailto:?bcc=${encodeURIComponent(destinatariosBCC)}&subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;

            let modalHTML = `
                <div class="flex flex-col gap-4 items-center">
                    <p class="text-xs text-gray-300 leading-relaxed text-left">El entorno requiere que elijas cómo abrir tu gestor. El texto y los correos se cargarán automáticamente.</p>
                    
                    <a href="${gmailLink}" target="_blank" rel="noopener noreferrer" onclick="cerrarModal()" class="bg-blue-neon text-white px-4 py-3 rounded-sm font-bold tracking-widest text-[11px] hover:bg-blue-500 transition-colors w-full text-center flex items-center justify-center gap-2">
                        <i data-lucide="chrome" class="w-4 h-4"></i> ABRIR GMAIL EN NAVEGADOR
                    </a>
