    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'slotsoftware-crm';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

        let db, auth, userId = null;
        window.trackedEmails = [];

        async function initFirebase() {
            try {
                if (Object.keys(firebaseConfig).length > 0) {
                    const app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    userId = auth.currentUser?.uid || crypto.randomUUID();
                    initFirestoreListener();
                } else {
                    console.warn("Firebase config not available. Running in local fallback mode.");
                    userId = "local-user";
                    loadLocalFallback();
                }
            } catch (err) {
                console.error("Firebase init error:", err);
                loadLocalFallback();
            }
        }

        function initFirestoreListener() {
            if (!db || !userId) return;
            const colRef = collection(db, 'artifacts', appId, 'users', userId, 'tracked_emails');
            onSnapshot(colRef, (snapshot) => {
                window.trackedEmails = [];
                snapshot.forEach((docSnap) => {
                    window.trackedEmails.push({ id: docSnap.id, ...docSnap.data() });
                });
                if (typeof renderTrackerTable === 'function') renderTrackerTable();
            }, (error) => {
                console.error("Firestore snapshot error:", error);
            });
        }

        function loadLocalFallback() {
            const saved = localStorage.getItem('slotsoftware_tracked_emails');
            if (saved) {
                window.trackedEmails = JSON.parse(saved);
            }
            if (typeof renderTrackerTable === 'function') renderTrackerTable();
        }

        window.saveEmailToTracker = async function(emailData) {
            const record = {
                destinatario: emailData.destinatario || 'Sin correo',
                empresa: emailData.empresa || 'Empresa desconocida',
                idioma: emailData.idioma,
                asunto: emailData.asunto,
                enviado: emailData.enviado || false,
                respondido: emailData.respondido || false,
                fecha: new Date().toISOString()
            };

            if (db && userId) {
                try {
                    const colRef = collection(db, 'artifacts', appId, 'users', userId, 'tracked_emails');
                    await addDoc(colRef, record);
                } catch (e) {
                    console.error("Error saving to Firestore:", e);
                }
            } else {
                record.id = 'local_' + Date.now();
                window.trackedEmails.unshift(record);
                localStorage.setItem('slotsoftware_tracked_emails', JSON.stringify(window.trackedEmails));
                renderTrackerTable();
            }
        }

        window.updateEmailStatus = async function(id, field, value) {
            if (db && userId && !id.startsWith('local_')) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'tracked_emails', id);
                    await updateDoc(docRef, { [field]: value });
                } catch (e) {
                    console.error("Error updating Firestore:", e);
                }
            } else {
                const item = window.trackedEmails.find(x => x.id === id);
                if (item) {
                    item[field] = value;
                    localStorage.setItem('slotsoftware_tracked_emails', JSON.stringify(window.trackedEmails));
                    renderTrackerTable();
                }
            }
        }

        window.deleteTrackedEmail = async function(id) {
            if (db && userId && !id.startsWith('local_')) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'users', userId, 'tracked_emails', id);
                    await deleteDoc(docRef);
                } catch (e) {
                    console.error("Error deleting from Firestore:", e);
                }
            } else {
                window.trackedEmails = window.trackedEmails.filter(x => x.id !== id);
                localStorage.setItem('slotsoftware_tracked_emails', JSON.stringify(window.trackedEmails));
                renderTrackerTable();
            }
        }

        initFirebase();
    </script>

        function switchTab(tab) {
            const genView = document.getElementById('view-generator');
            const trackView = document.getElementById('view-tracker');
            const tabGen = document.getElementById('tab-generator');
            const tabTrack = document.getElementById('tab-tracker');

            if (tab === 'generator') {
                genView.classList.remove('hidden');
                trackView.classList.add('hidden');
                tabGen.className = "flex-1 py-3 font-semibold text-center text-blue-400 border-b-2 border-blue-500 transition-all flex items-center justify-center gap-2";
                tabTrack.className = "flex-1 py-3 font-semibold text-center text-gray-400 hover:text-gray-200 border-b-2 border-transparent transition-all flex items-center justify-center gap-2";
            } else {
                genView.classList.add('hidden');
                trackView.classList.remove('hidden');
                tabTrack.className = "flex-1 py-3 font-semibold text-center text-blue-400 border-b-2 border-blue-500 transition-all flex items-center justify-center gap-2";
                tabGen.className = "flex-1 py-3 font-semibold text-center text-gray-400 hover:text-gray-200 border-b-2 border-transparent transition-all flex items-center justify-center gap-2";
                renderTrackerTable();
            }
        }

        function updateEmail() {
            const idioma = document.getElementById('idioma').value;
            let empresa = document.getElementById('empresa').value.trim();
            if (!empresa) {
                empresa = "[Empresa / Responsable]";
            }

            const data = content[idioma];
            document.getElementById('asunto').value = data.subject;
            
            let finalBody = data.body.replace(/{empresa}/g, empresa);
            document.getElementById('cuerpo').value = finalBody;
        }

        function copyToClipboard() {
            const bodyText = document.getElementById('cuerpo').value;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(bodyText).then(() => showNotification("¡Texto copiado al portapapeles!"));
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = bodyText;
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showNotification("¡Texto copiado al portapapeles!");
                } catch (err) {
                    console.error('Failed to copy', err);
                }
                document.body.removeChild(textArea);
            }
        }

        async function sendEmailAndTrack() {
            const destinatario = document.getElementById('destinatario').value.trim();
            const empresa = document.getElementById('empresa').value.trim();
            const idioma = document.getElementById('idioma').value;
            const asunto = document.getElementById('asunto').value;

            // Guardar en el CRM de envíos
            await window.saveEmailToTracker({
                destinatario: destinatario || 'Sin correo especificado',
                empresa: empresa || 'Empresa Anónima',
                idioma: idioma,
                asunto: asunto,
                enviado: true,
                respondido: false
            });

            // Abrir gestor de correo predeterminado
            const encDest = encodeURIComponent(destinatario);
            const encAsunto = encodeURIComponent(asunto);
            const encCuerpo = encodeURIComponent(document.getElementById('cuerpo').value);
            
            window.location.href = `mailto:${encDest}?subject=${encAsunto}&body=${encCuerpo}`;
            showNotification("¡Correo registrado en el Control de Envíos y abierto!");
        }

        window.renderTrackerTable = function() {
            const tbody = document.getElementById('tracker-tbody');
            const emptyState = document.getElementById('tracker-empty');
            const badge = document.getElementById('counter-badge');
            
            const list = window.trackedEmails || [];
            badge.innerText = list.length;

            if (list.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            let html = '';

            list.forEach(item => {
                const dateStr = new Date(item.fecha).toLocaleDateString() + ' ' + new Date(item.fecha).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                html += `
                    <tr class="hover:bg-[#1f1f1f] transition-all">
                        <td class="p-3">
                            <div class="font-semibold text-gray-200">${item.empresa}</div>
                            <div class="text-xs text-gray-400">${item.destinatario}</div>
                        </td>
                        <td class="p-3 text-xs text-gray-400">${dateStr}</td>
                        <td class="p-3 text-center">
                            <input type="checkbox" ${item.enviado ? 'checked' : ''} onchange="updateEmailStatus('${item.id}', 'enviado', this.checked)" class="w-4 h-4 accent-blue-500 cursor-pointer">
                        </td>
                        <td class="p-3 text-center">
                            <input type="checkbox" ${item.respondido ? 'checked' : ''} onchange="updateEmailStatus('${item.id}', 'respondido', this.checked)" class="w-4 h-4 accent-green-500 cursor-pointer">
                        </td>
                        <td class="p-3 text-center space-x-2">
                            <button onclick="deleteTrackedEmail('${item.id}')" title="Eliminar registro" class="p-1.5 bg-red-900/40 hover:bg-red-800/60 text-red-300 rounded transition-all">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function showNotification(msg) {
            const notif = document.getElementById('notification');
            notif.innerText = msg;
            notif.classList.remove('hidden');
            setTimeout(() => { 
                notif.classList.add('hidden'); 
            }, 3500);
        }

        // Initialize on load
        window.onload = function() {
            updateEmail();
            if (typeof renderTrackerTable === 'function') renderTrackerTable();
        };
    </script>
</body>
</html>
